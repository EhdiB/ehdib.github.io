<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,700;1,500&family=Martian+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14133A;
    --panel:#1E1D4E;
    --border:#35347A;
    --text:#EDEBFA;
    --accent:#9B8CFF;
    --highlight:#FFD24A;
    --muted:#8B89C4;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--accent) 22%, var(--ink)) 0%, rgba(0,0,0,0) 60%),
      var(--ink);
    color:var(--text);
    font-family:"Familjen Grotesk",system-ui,-apple-system,sans-serif;
    height:100dvh;
    overflow:hidden;
    padding:max(14px,env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;
    transition:background .35s ease,color .35s ease;
  }
  .app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;gap:12px}

  /* ---- header ---- */
  header{display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
  .title-row{display:flex;flex-direction:column}
  .actions-row{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px}
  .brand{font-size:clamp(24px,9vw,38px);font-weight:700;letter-spacing:.1em;line-height:.95;margin:0}
  .btn-new-game{
    font-family:"Martian Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink);background:var(--highlight);
    border:0;border-radius:999px;padding:10px 16px;cursor:pointer;white-space:nowrap;
    flex:0 0 auto;transition:background .35s ease
  }
  .btn-new-game:active{transform:translateY(1px)}
  .icon-btn{
    flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;
    background:transparent;border:1px solid var(--border);border-radius:999px;
    color:var(--text);cursor:pointer;padding:0
  }
  .icon-btn:active{transform:translateY(1px)}
  .icon-btn svg{width:17px;height:17px}
  .icon-btn .icon-exit{display:none}
  .info-glyph{font-family:"Martian Mono",monospace;font-weight:800;font-size:20px;line-height:1}
  body.fullscreen .icon-btn .icon-enter{display:none}
  body.fullscreen .icon-btn .icon-exit{display:block}

  /* ---- word grid ---- */
  .grid{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0}
  .word-tile{
    position:relative;display:flex;align-items:stretch;gap:0;flex:1 1 0;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;width:100%;padding:0;text-align:left;
    font:inherit;color:inherit;min-height:0;
    transition:background .35s ease,border-color .35s ease;
  }
  .word-tile:focus-visible{outline:2px solid var(--highlight);outline-offset:2px}
  .tile-number{
    flex:0 0 48px;display:grid;place-items:center;
    font-family:"Martian Mono",monospace;font-size:19px;font-weight:800;
    color:var(--accent);border-right:1px solid var(--border);
    background:rgba(0,0,0,.16);transition:color .35s ease,border-color .35s ease;
  }
  .tile-content{position:relative;flex:1;display:grid;place-items:center start;padding:0 16px}
  .word-text{
    font-size:clamp(17px,5.4vw,24px);font-weight:700;letter-spacing:-.01em;
    text-transform:capitalize;
    opacity:0;transform:translateY(4px);transition:opacity .22s ease,transform .22s ease
  }
  .word-tile.revealed .word-text{opacity:1;transform:none}
  .mask{
    position:absolute;inset:0;display:flex;align-items:center;padding:0 16px;
    background:
      repeating-linear-gradient(-45deg,
        color-mix(in srgb, var(--panel) 88%, white 6%) 0 9px,
        color-mix(in srgb, var(--panel) 88%, black 10%) 9px 18px);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  .word-tile.revealed .mask{transform:translateX(101%)}
  .mask em{
    font-family:"Martian Mono",monospace;font-style:normal;font-size:10px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--muted)
  }

  /* ---- code panel ---- */
  .code{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;display:flex;flex-direction:column;gap:10px;flex:0 0 auto;
    transition:background .35s ease,border-color .35s ease;
  }
  .code h2{
    font-family:"Martian Mono",monospace;font-size:9px;font-weight:600;letter-spacing:.26em;
    text-transform:uppercase;color:var(--muted);margin:0
  }
  .code-digits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .digit{
    background:var(--ink);border:1px solid var(--border);border-radius:10px;
    display:grid;place-items:center;padding:10px 0;
    font-family:"Martian Mono",monospace;font-size:clamp(26px,9vw,38px);font-weight:800;
    color:var(--highlight);line-height:1;transition:border-color .35s ease,color .35s ease;
  }
  .code.hidden .digit{color:var(--muted)}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{
    font-family:"Martian Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;padding:11px 8px;border-radius:10px;cursor:pointer;
    background:transparent;color:var(--text);border:1px solid var(--border)
  }
  .btn.filled{background:var(--accent);border-color:var(--accent);color:var(--ink);transition:background .35s ease,border-color .35s ease}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--highlight);outline-offset:2px}

  .footer-hint{
    font-family:"Martian Mono",monospace;font-size:8.5px;letter-spacing:.12em;
    color:var(--muted);text-align:center;text-transform:uppercase;line-height:1.4;
    margin:0;flex:0 0 auto
  }

  /* ---- dialogs ---- */
  dialog{
    border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);
    color:var(--text);padding:22px;width:min(360px,calc(100vw - 44px));
    font-family:inherit;max-height:min(560px,calc(100dvh - 60px));overflow:auto
  }
  dialog::backdrop{background:rgba(10,9,32,.75)}
  dialog h3{margin:0 0 8px;font-size:22px;font-weight:700}
  dialog p{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.5}
  dialog .btn-row{grid-template-columns:1fr 1fr}

  /* ---- settings ---- */
  .settings-group{margin-bottom:20px}
  .settings-label{
    font-family:"Martian Mono",monospace;font-size:9px;font-weight:600;letter-spacing:.24em;
    text-transform:uppercase;color:var(--muted);margin:0 0 10px
  }
  .segmented{display:flex;background:var(--ink);border:1px solid var(--border);border-radius:999px;padding:3px}
  .segmented-opt{
    flex:1;text-align:center;padding:9px 0;border-radius:999px;border:0;background:transparent;
    color:var(--muted);font-family:"Martian Mono",monospace;font-size:11px;font-weight:600;
    letter-spacing:.08em;cursor:pointer
  }
  .segmented-opt.active{background:var(--accent);color:var(--ink)}
  .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .theme-option{
    display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;
    border:2px solid transparent;border-radius:12px;padding:8px 4px;cursor:pointer
  }
  .theme-option.active{border-color:var(--text)}
  .theme-swatch{width:34px;height:34px;border-radius:50%;border:1px solid rgba(127,127,127,.3)}
  .theme-name{font-family:"Martian Mono",monospace;font-size:8.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;text-align:center}
  .btn-close{
    width:100%;margin-top:4px;font-family:"Martian Mono",monospace;font-size:10px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;padding:12px;border-radius:10px;cursor:pointer;
    background:var(--accent);color:var(--ink);border:0
  }

  /* ---- info ---- */
  .info-list{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:14px}
  .info-list li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--text)}
  .info-num{
    flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--ink);
    display:grid;place-items:center;font-family:"Martian Mono",monospace;font-size:11px;font-weight:800
  }
  .info-note{font-size:13px;line-height:1.55;color:var(--muted);margin:-4px 0 18px}
  .info-note a{color:var(--accent);font-weight:600;text-decoration:underline}

  /* ---- language picker ---- */
  .language-grid{display:flex;flex-direction:column;gap:8px}
  .language-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--ink);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;cursor:pointer;color:var(--text);
    font-family:"Familjen Grotesk",sans-serif;font-size:14px;font-weight:500;text-align:left
  }
  .language-item.active{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, var(--ink))}
  .language-item .checkmark{width:14px;height:14px;flex:0 0 auto;color:var(--accent);opacity:0}
  .language-item.active .checkmark{opacity:1}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>

      </button>
      <button class="btn-new-game" id="btnNewGame">Nouvelle partie</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <section class="code hidden" id="codePanel">
    <h2 id="textCodeTitle">Code de transmission</h2>
    <div class="code-digits">
      <div class="digit" id="digit0">•</div>
      <div class="digit" id="digit1">•</div>
      <div class="digit" id="digit2">•</div>
    </div>
    <div class="btn-row">
      <button class="btn filled" id="btnShowCode">Afficher le code</button>
      <button class="btn" id="btnNewCode">Nouveau code</button>
    </div>
  </section>

  <p class="footer-hint" id="textFooterHint">Touchez un mot pour l'afficher ou le masquer</p>
</div>

<dialog id="dlgNewGame">
  <h3 id="textNewGameTitle">Nouvelle partie ?</h3>
  <p id="textNewGameBody">Les quatre mots actuels seront remplacés.</p>
  <div class="btn-row">
    <button class="btn" id="btnNewGameCancel">Annuler</button>
    <button class="btn filled" id="btnNewGameStart">Commencer</button>
  </div>
</dialog>

<dialog id="dlgScreen">
  <h3 id="textScreenTitle">Garder l'écran allumé ?</h3>
  <p id="textScreenBody">L'écran restera actif pendant la partie.</p>
  <div class="btn-row">
    <button class="btn" id="btnScreenNo">Non</button>
    <button class="btn filled" id="btnScreenYes">Oui (conseillé)</button>
  </div>
</dialog>

<dialog id="dlgInfo">
  <h3 id="textInfoTitle">How to play</h3>
  <ol class="info-list" id="infoList"></ol>
  <p class="info-note" id="infoScoresheet"></p>
  <button class="btn-close" id="btnCloseInfo">Close</button>
</dialog>

<dialog id="dlgLanguage">
  <h3 id="textLanguageDialogTitle">Langue</h3>
  <div class="language-grid" id="languageGrid"></div>
</dialog>

<dialog id="dlgSettings">
  <h3 id="textSettingsTitle">Réglages</h3>
  <div class="settings-group">
    <p class="settings-label" id="textThemeLabel">Couleur d'équipe</p>
    <div class="segmented" style="margin-bottom:14px">
      <button class="segmented-opt" id="modeDark" data-mode="dark">Obscur</button>
      <button class="segmented-opt" id="modeLight" data-mode="light">Clair</button>
    </div>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
  <button class="btn-close" id="btnCloseSettings">Fermer</button>
</dialog>

/* ============ app state ============ */
let state = {lang:'en', theme:'violet', mode:'dark'};
try{
  const saved = JSON.parse(localStorage.getItem('decrypto-config') || 'null');
  if(saved && saved.lang && saved.theme) state = Object.assign(state, saved);
}catch(e){ /* storage unavailable, fall back to defaults */ }

function save(){
  try{ localStorage.setItem('decrypto-config', JSON.stringify(state)); }catch(e){}
}

/* ============ DOM references ============ */
const grid = document.getElementById('grid');
const codePanel = document.getElementById('codePanel');
const codeDigits = [0,1,2].map(i => document.getElementById('digit'+i));
const btnShowCode = document.getElementById('btnShowCode');
let currentCode = [], codeVisible = false, wakeLock = null;

/* ============ language ============ */
function applyLanguage(lang, redraw){
  state.lang = lang;
  const t = I18N[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;
  document.getElementById('textBrand').textContent = t.brandText;
  document.getElementById('btnNewGame').textContent = t.newGame;
  document.getElementById('btnSettings').setAttribute('aria-label', t.settings);
  document.getElementById('btnFullscreen').setAttribute('aria-label', isFullscreen() ? t.fullscreenExit : t.fullscreenEnter);
  document.getElementById('textCodeTitle').textContent = t.codeTitle;
  btnShowCode.textContent = codeVisible ? t.hideCode : t.showCode;
  document.getElementById('btnNewCode').textContent = t.newCode;
  document.getElementById('textFooterHint').textContent = t.footerHint;
  document.querySelectorAll('.mask em').forEach(el => el.textContent = t.tileHint);
  document.getElementById('textNewGameTitle').textContent = t.newGameTitle;
  document.getElementById('textNewGameBody').textContent = t.newGameBody;
  document.getElementById('btnNewGameCancel').textContent = t.cancel;
  document.getElementById('btnNewGameStart').textContent = t.start;
  document.getElementById('textScreenTitle').textContent = t.screenTitle;
  document.getElementById('textScreenBody').textContent = t.screenBody;
  document.getElementById('btnScreenNo').textContent = t.no;
  document.getElementById('btnScreenYes').textContent = t.yes;
  document.getElementById('textSettingsTitle').textContent = t.settingsTitle;
  document.getElementById('textLanguageDialogTitle').textContent = t.langLabel;
  document.getElementById('btnLanguage').setAttribute('aria-label', t.langLabel);
  document.getElementById('btnInfo').setAttribute('aria-label', t.infoLabel);
  document.getElementById('textInfoTitle').textContent = t.infoTitle;
  document.getElementById('btnCloseInfo').textContent = t.close;
  renderInfoList(t.infoSteps);
  document.getElementById('infoScoresheet').innerHTML =
    t.scoresheetIntro + ' <a href="'+SCORESHEET_URL+'" target="_blank" rel="noopener noreferrer">'+t.scoresheetLinkText+'</a>'+t.scoresheetOutro;
  document.getElementById('textThemeLabel').textContent = t.themeLabel;
  document.getElementById('btnCloseSettings').textContent = t.close;
  document.querySelectorAll('.language-item').forEach(el => el.classList.toggle('active', el.dataset.lang===lang));
  document.getElementById('modeDark').textContent = t.modeDark;
  document.getElementById('modeLight').textContent = t.modeLight;
  document.querySelectorAll('.theme-name').forEach(el=>{
    const theme = THEMES.find(x=>x.id===el.dataset.theme);
    if(theme) el.textContent = theme[lang];
  });
  save();
  if(redraw){
    renderGrid(drawWords());
    currentCode = drawCode();
    showCode(false);
  }
}

function renderInfoList(steps){
  const list = document.getElementById('infoList');
  list.innerHTML = '';
  steps.forEach((step,i)=>{
    const li = document.createElement('li');
    li.innerHTML = '<span class="info-num">'+(i+1)+'</span><span>'+step+'</span>';
    list.appendChild(li);
  });
}

function buildLanguageList(){
  const container = document.getElementById('languageGrid');
  container.innerHTML = '';
  LANGUAGES.forEach(language=>{
    const b = document.createElement('button');
    b.className = 'language-item';
    b.type = 'button';
    b.dataset.lang = language.id;
    b.innerHTML = '<span>'+language.flag+'&nbsp;&nbsp;'+language.name+'</span><svg class="checkmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    b.addEventListener('click', ()=> chooseLanguage(language.id));
    container.appendChild(b);
  });
}
function chooseLanguage(id){
  applyLanguage(id, true);
  dlgLanguage.close();
}

/* ============ colour theme ============ */
function applyPalette(shouldSave){
  const theme = THEMES.find(x=>x.id===state.theme) || THEMES[0];
  const base = state.mode === 'light' ? theme.light : theme.dark;
  const root = document.documentElement.style;
  root.setProperty('--ink', base.ink);
  root.setProperty('--panel', base.panel);
  root.setProperty('--border', base.border);
  root.setProperty('--accent', theme.accent);
  root.setProperty('--highlight', theme.highlight);
  root.setProperty('--muted', base.muted);
  root.setProperty('--text', base.text);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', base.ink);
  document.querySelectorAll('.theme-option').forEach(el => el.classList.toggle('active', el.dataset.theme===theme.id));
  document.querySelectorAll('.segmented-opt').forEach(el => el.classList.toggle('active', el.dataset.mode===state.mode));
  if(shouldSave) save();
}

function chooseTheme(id){ state.theme = id; applyPalette(true); }
function chooseMode(mode){ state.mode = mode; applyPalette(true); }

function buildThemeList(){
  const container = document.getElementById('themeGrid');
  container.innerHTML = '';
  THEMES.forEach(theme=>{
    const b = document.createElement('button');
    b.className = 'theme-option';
    b.type = 'button';
    b.dataset.theme = theme.id;
    b.innerHTML = '<span class="theme-swatch" style="background:'+theme.accent+'"></span><span class="theme-name" data-theme="'+theme.id+'">'+theme[state.lang]+'</span>';
    b.addEventListener('click', ()=> chooseTheme(theme.id));
    container.appendChild(b);
  });
}

/* ============ words & grid ============ */
function drawWords(){
  const pool = WORDS[state.lang].slice();
  const picks = [];
  for(let i=0;i<4;i++){
    picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  }
  return picks;
}

function renderGrid(words){
  grid.innerHTML = '';
  words.forEach((word,i)=>{
    const b = document.createElement('button');
    b.className = 'word-tile';
    b.type = 'button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML =
      '<span class="tile-number">'+(i+1)+'</span>'+
      '<span class="tile-content"><span class="word-text"></span>'+
      '<span class="mask"><em>'+I18N[state.lang].tileHint+'</em></span></span>';
    b.querySelector('.word-text').textContent = word;
    b.addEventListener('click',()=>{
      const revealed = b.classList.toggle('revealed');
      b.setAttribute('aria-pressed', revealed ? 'true':'false');
    });
    grid.appendChild(b);
  });
}

/* ============ code ============ */
function drawCode(){
  const n = [1,2,3,4];
  const c = [];
  for(let i=0;i<3;i++) c.push(n.splice(Math.floor(Math.random()*n.length),1)[0]);
  return c;
}

function showCode(visible){
  codeVisible = visible;
  codePanel.classList.toggle('hidden',!visible);
  btnShowCode.textContent = visible ? I18N[state.lang].hideCode : I18N[state.lang].showCode;
  codeDigits.forEach((el,i)=> el.textContent = visible ? currentCode[i] : '•');
}

function scrambleCode(){
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!codeVisible || reducedMotion){ showCode(codeVisible); return; }
  let ticks = 0;
  const id = setInterval(()=>{
    codeDigits.forEach(el => el.textContent = 1 + Math.floor(Math.random()*4));
    if(++ticks > 7){ clearInterval(id); showCode(true); }
  },45);
}

function generateNewCode(){
  currentCode = drawCode();
  scrambleCode();
}

btnShowCode.addEventListener('click',()=>showCode(!codeVisible));
document.getElementById('btnNewCode').addEventListener('click',generateNewCode);

/* ============ game dialogs ============ */
const newGameDialog = document.getElementById('dlgNewGame');
const screenDialog  = document.getElementById('dlgScreen');
const settingsDialog = document.getElementById('dlgSettings');
const dlgLanguage = document.getElementById('dlgLanguage');
const dlgInfo = document.getElementById('dlgInfo');

document.getElementById('btnNewGame').addEventListener('click',()=>newGameDialog.showModal());
document.getElementById('btnNewGameCancel').addEventListener('click',()=>newGameDialog.close());
document.getElementById('btnNewGameStart').addEventListener('click',()=>{
  newGameDialog.close();
  renderGrid(drawWords());
  currentCode = drawCode();
  showCode(false);
  if(!wakeLock && 'wakeLock' in navigator) screenDialog.showModal();
});

document.getElementById('btnScreenNo').addEventListener('click',()=>screenDialog.close());
document.getElementById('btnScreenYes').addEventListener('click',async ()=>{
  screenDialog.close();
  try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){ wakeLock = null; }
});
document.addEventListener('visibilitychange',async()=>{
  if(wakeLock && document.visibilityState==='visible'){
    try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){ wakeLock = null; }
  }
});

/* ============ settings ============ */
document.getElementById('btnSettings').addEventListener('click',()=>settingsDialog.showModal());
document.getElementById('btnCloseSettings').addEventListener('click',()=>settingsDialog.close());
document.getElementById('btnLanguage').addEventListener('click',()=>dlgLanguage.showModal());
document.getElementById('btnInfo').addEventListener('click',()=>dlgInfo.showModal());
document.getElementById('btnCloseInfo').addEventListener('click',()=>dlgInfo.close());
document.getElementById('modeDark').addEventListener('click',()=>chooseMode('dark'));
document.getElementById('modeLight').addEventListener('click',()=>chooseMode('light'));

/* ============ fullscreen ============ */
const btnFullscreen = document.getElementById('btnFullscreen');
function isFullscreen(){ return !!document.fullscreenElement; }
function updateFullscreenButton(){
  const active = isFullscreen();
  document.body.classList.toggle('fullscreen', active);
  btnFullscreen.setAttribute('aria-pressed', active ? 'true' : 'false');
  btnFullscreen.setAttribute('aria-label', active ? I18N[state.lang].fullscreenExit : I18N[state.lang].fullscreenEnter);
}
btnFullscreen.addEventListener('click', async ()=>{
  try{
    if(!isFullscreen()){ await document.documentElement.requestFullscreen(); }
    else{ await document.exitFullscreen(); }
  }catch(e){ /* fullscreen API unavailable on this device */ }
});
document.addEventListener('fullscreenchange', updateFullscreenButton);

/* ============ startup ============ */
buildThemeList();
buildLanguageList();
applyPalette(false);
applyLanguage(state.lang, false);
renderGrid(drawWords());
currentCode = drawCode();
showCode(false);
</script>
